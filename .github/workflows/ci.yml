# 🧠 Nome da pipeline
# Esse nome será exibido na aba "Actions" do GitHub
name: Run GEOLOGICAL FEATURES DETECTOR (GFD Pipeline)

# 🚀 Quando o workflow será executado?
# O workflow será acionado automaticamente quando houver:
# - um "push" para o branch main
# - uma "pull request" para o branch main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 📦 Definição dos jobs da pipeline (executados em sequência)
jobs:

  # 🔧 JOB 1: Treinamento do modelo com train.py
  train-model:
    name: Treinar modelo CNN (train.py)
    runs-on: ubuntu-latest  # Sistema Ubuntu mais recente

    steps:
      # 📥 Clona o repositório para a máquina virtual do GitHub
      - name: Clonar repositório
        uses: actions/checkout@v4

      # 🐍 Configura o ambiente Python
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 📦 Instala as dependências do projeto
      # requirements.txt deve conter torch, torchvision, opencv-python, matplotlib etc.
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 🧠 Executa o script de treinamento
      # Espera-se que crie um arquivo como "cnn_seismic_model.pth"
      - name: Treinar modelo com train.py
        run: |
          python train.py

      # 📤 Salva o modelo treinado como artifact
      - name: Upload do modelo treinado
        uses: actions/upload-artifact@v4
        with:
          name: modelo-treinado
          path: cnn_seismic_model_30_05.pth

  # 🔍 JOB 2: Aplicação do modelo treinado com GFD.py
  run-gfd:
    name: Rodar GFD (GFD.py)
    needs: train-model  # ➕ Executa somente após o job de treino
    runs-on: ubuntu-latest

    steps:
      # 📥 Clona o repositório
      - name: Clonar repositório
        uses: actions/checkout@v4

      # 🐍 Configura o Python
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 📦 Instala dependências novamente
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 📥 Baixa o modelo treinado do job anterior
      - name: Baixar modelo treinado
        uses: actions/download-artifact@v4
        with:
          name: modelo-treinado
          path: models


      # 🗂️ Cria diretório de saída
      - name: Criar pasta de resultados
        run: |
          mkdir -p GFD_results/window

      # 🚀 Executa a inferência com o script GFD.py
      - name: Rodar identificador geológico com GFD.py
        run: |
          python GFD.py --image_path seismic_2D/2D_002_3.png --model_path models/cnn_seismic_model_30_05.pth --save_dir GFD_results/window
