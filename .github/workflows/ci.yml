name: Geological Feature Detection (GFD Pipeline)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  train-model:
    name: 🔧 Treinamento do Modelo CNN
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v3

      - name: 🐍 Configurar ambiente Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧠 Rodar treino com train.py
        run: |
          python train.py

      - name: 📤 Salvar modelo como artifact
        uses: actions/upload-artifact@v3
        with:
          name: modelo-cnn-treinado
          path: cnn_seismic_model_30_05.pth

  run-gfd:
    name: 🔍 Inferência com GFD.py
    needs: train-model
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v3

      - name: 🐍 Configurar ambiente Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📥 Baixar modelo treinado
        uses: actions/download-artifact@v3
        with:
          name: modelo-cnn-treinado
          path: ./models

      - name: 📂 Criar diretórios necessários
        run: |
          mkdir -p GFD_results/window

      - name: 🚀 Rodar inferência com GFD.py
        run: |
          python GFD.py --image_path seismic_2D/2D_002_3.png --model_path models/cnn_seismic_model_30_05.pth --save_dir GFD_results/window
